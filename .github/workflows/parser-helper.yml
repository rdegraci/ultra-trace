name: parser-helper

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-helper:
    name: Build helper + pin + fixture spike
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          swift --version
          xcodebuild -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Build swift-parser-helper
        run: ./scripts/build_parser_helper.sh

      - name: Validate toolchain pin (fail on drift)
        run: python scripts/validate_parser_toolchain.py --fail-on-drift

      - name: Fixture spike metrics
        run: |
          mkdir -p docs/cache/spikes/results
          python scripts/run_parser_spike.py \
            --output docs/cache/spikes/results/fixtures-ci.json

      - name: Pytest (parser + unit)
        run: pytest -q

      - name: Mypy
        run: mypy
