# Sample project / nightly CI config (Core defaults).
# Copy to the repo root as ultra-trace.yml or pass --config.
#
# Defaults: Core only, privacyMode offline, LLM off.
# Do not set --fail-on-partial-analysis in nightly CI (unsupported Swift
# should surface in the report, not fail the job).
# Do not auto-execute generated XCTest proof scaffolds from *-proofs/.
#
# Severity gate: severityThreshold medium → exit 1 when findings meet it.
# Privacy: offline blocks network; keep llm.enabled false unless assisting.
#
# Swift helper CI must run on macOS + Xcode. Pin/drift:
#   python scripts/validate_parser_toolchain.py --fail-on-drift

analysisModes:
  - core
  # Add `advanced` to run the SIL explorer (swiftc -emit-sil) with Core fallback.

# Phase 4: add `advanced` for overflow / IUO misuse / deep taint / div-by-zero.
rulePacks:
  - core

# Phase 6: set to `python` for Python AST analysis (skips Swift helper/SIL).
targetLanguage: swift

privacyMode: offline

llm:
  enabled: false

severityThreshold: medium
proofMode: mixed
maxDepth: 12

outputFormats:
  - markdown
  - json

includePaths: []
excludePaths:
  - .git
  - DerivedData
  - .build
  - Pods
  - Carthage
  - SourcePackages

focusModules: []

swiftFrontend:
  helperPath: null
  parserVersion: null
  toolchainPath: null
  supportedSubsetMode: core
  helperTimeoutSeconds: 120

advanced:
  enabled: false
  # silToolchainPath: /path/to/Xcode.app/Contents/Developer/Toolchains/...

callSummary:
  # Phase 5: set enabled true and maxDepth 1–2 for bounded callee summaries.
  # Defaults stay off so Core MVP behavior is unchanged.
  enabled: false
  maxDepth: 0

# Optional: replay a recorded exploration plan from a prior run's *-plan.json
# planReplayPath: /tmp/ultra-trace/ultra-trace-report-plan.json
