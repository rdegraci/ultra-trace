# Profile: assist (day-to-day explore / repl / serve).
# Use with: ultra-trace explore|repl|serve --config examples/ultra-trace-assist.yml
# Or omit --config: built-in explore defaults match this intent (ultra assist).
#
# Ultra assist: Core + advanced rule packs, call summaries, LLM advisory.
# Does not enable SIL analysisModes advanced (opt-in separately).
# CI gates: examples/ultra-trace.yml (ci) or examples/ultra-trace-ci-full.yml.
# LLM-proposed candidates never fail Core severity gates.
# Do not auto-execute generated XCTest/pytest proof scaffolds.

analysisModes:
  - core

rulePacks:
  - core
  - advanced

targetLanguage: swift

# Assist needs a non-offline privacy mode so path briefs can be sent (redacted).
privacyMode: redacted

llm:
  enabled: true
  allowedFeatures:
    - exploration_planning
    - remediation_wording
    - reproduction_drafting
    - report_summary
    - proof_prose_polishing
    - candidate_proposals

severityThreshold: medium
proofMode: mixed
maxDepth: 12

outputFormats:
  - markdown
  - json

includePaths: []
excludePaths:
  - .git
  - DerivedData
  - .build
  - Pods
  - Carthage
  - SourcePackages

focusModules: []

callSummary:
  # Bounded summaries + SDK stubs improve iOS/macOS tracing under explore.
  enabled: true
  maxDepth: 1

advanced:
  enabled: false

swiftFrontend:
  helperPath: null
  helperTimeoutSeconds: 120
